<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Camera on a tripod with field-of-view dotted arrows pointing at the working area.">
  <title>Camera on tripod, field of view</title>
  <g fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera body -->
    <rect x="80" y="48" width="100" height="56" rx="6" />
    <!-- Hot shoe -->
    <rect x="106" y="40" width="22" height="10" rx="1.5" />
    <!-- Lens barrel -->
    <rect x="160" y="60" width="40" height="32" rx="3" />
    <!-- Lens aperture circle -->
    <circle cx="200" cy="76" r="10" />
    <circle cx="200" cy="76" r="4" />
    <!-- Viewfinder -->
    <rect x="92" y="42" width="14" height="10" rx="1.5" />
    <!-- Tripod head -->
    <path d="M120 104 L140 104 L140 116 L120 116 Z" />
    <!-- Tripod legs -->
    <line x1="130" y1="116" x2="80" y2="216" />
    <line x1="130" y1="116" x2="130" y2="220" />
    <line x1="130" y1="116" x2="180" y2="216" />
    <!-- Tripod feet -->
    <line x1="72" y1="216" x2="88" y2="216" />
    <line x1="122" y1="220" x2="138" y2="220" />
    <line x1="172" y1="216" x2="188" y2="216" />
    <!-- Field-of-view dashed cone pointing right -->
    <line x1="200" y1="76" x2="304" y2="40" stroke-dasharray="4 4" />
    <line x1="200" y1="76" x2="304" y2="112" stroke-dasharray="4 4" />
    <!-- Working-area marker -->
    <circle cx="298" cy="76" r="6" fill="#1a1a1a" stroke="none" />
    <line x1="298" y1="86" x2="298" y2="100" />
    <path d="M294 96 L298 100 L302 96" />
  </g>
</svg>
