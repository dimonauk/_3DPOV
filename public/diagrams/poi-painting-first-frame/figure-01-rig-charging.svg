<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Wrist-mounted POV rig charging via USB.">
  <title>POV rig charging via USB</title>
  <g fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Forearm + wrist outline -->
    <path d="M40 160 L40 130 Q40 110 60 100 L160 70 Q190 64 200 80" />
    <path d="M40 200 L40 178 Q40 158 60 148 L160 118 Q190 112 210 124" />
    <!-- Hand stub -->
    <path d="M200 80 Q230 86 230 102 Q230 130 200 124 Q200 100 200 80 Z" />
    <!-- Rig strap -->
    <path d="M90 96 L96 158" />
    <path d="M180 80 L186 142" />
    <!-- Rig housing -->
    <rect x="100" y="84" width="80" height="56" rx="6" />
    <!-- LED strips on the rig -->
    <line x1="110" y1="98" x2="170" y2="98" />
    <line x1="110" y1="110" x2="170" y2="110" />
    <line x1="110" y1="122" x2="170" y2="122" />
    <!-- USB-C port + cable -->
    <rect x="172" y="106" width="14" height="10" rx="2" />
    <path d="M186 111 Q230 116 260 90 Q280 72 296 56" />
    <!-- USB plug at far end -->
    <rect x="282" y="40" width="22" height="14" rx="2" />
    <!-- Charge indicator (small bolt) -->
    <path d="M138 92 L132 110 L142 110 L136 124" />
  </g>
</svg>
