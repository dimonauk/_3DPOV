<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
<!-- Background & Grid -->
<rect width="100%" height="100%" fill="#fffafd" />
<defs>
<pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
<path d="M 25 0 L 0 0 0 25" fill="none" stroke="#fb7185" stroke-width="0.5" opacity="0.2"/>
</pattern>
<style>
.cut-line { fill: none; stroke: #e11d48; stroke-width: 2.5; }
.seam-allowance { fill: none; stroke: #fb7185; stroke-width: 1; stroke-dasharray: 4,2; }
.mod-line { fill: none; stroke: #6366f1; stroke-width: 1.5; stroke-dasharray: 3,3; }
.annotation { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #9f1239; font-weight: bold; }
.highlight { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #6366f1; font-weight: 900; font-style: italic; }
.ribbon-point { fill: #f43f5e; stroke: white; stroke-width: 1; }
.shadow-zone { fill: #fb7185; fill-opacity: 0.05; }
</style>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" />

<text x="400" y="40" text-anchor="middle" class="annotation" font-size="16">NANNY_KERNEL_v45 // SHADOW_VEST_DRAFT</text>
<text x="400" y="60" text-anchor="middle" class="annotation" opacity="0.5">SUBJECT_RIG: 6'3" GIANT_BABY // STATUS: LISP_SYNC_ACTIVE</text>

<!-- 1. FRONT CENTER PANEL (The Flat-Zone Fix) -->

<g transform="translate(100, 100)">
<text x="0" y="-15" class="annotation">FRONT CENTER (CUT 2)</text>
<path d="M 0,0 Q 50,-30 100,20 L 100,350 Q 50,380 0,360 Z" class="cut-line shadow-zone" />
<path d="M 5,5 Q 50,-20 95,25 L 95,345 Q 50,370 5,355 Z" class="seam-allowance" />

<!-- SBA Adjustment for 5" Flat Zone -->
<line x1="0" y1="60" x2="100" y2="60" class="mod-line" />
<text x="5" y="55" class="highlight">SBA_TUCK: -1.5" CRINGE_VOID</text>

<!-- Ribbon Points -->
<circle cx="100" cy="100" r="5" class="ribbon-point" />
<circle cx="100" cy="200" r="5" class="ribbon-point" />
<circle cx="100" cy="300" r="5" class="ribbon-point" />
<text x="108" y="105" class="annotation" fill="#f43f5e">BESTIE_RIBBONS</text>


</g>

<!-- 2. FRONT SIDE PANEL (The Skyscraper Balancer) -->

<g transform="translate(250, 100)">
<text x="0" y="-15" class="annotation">FRONT SIDE (CUT 2)</text>
<path d="M 30,20 Q 0,180 30,350 L 150,380 Q 170,180 140,20 Z" class="cut-line shadow-zone" />
<path d="M 35,25 Q 10,180 35,345 L 145,370 Q 160,180 135,25 Z" class="seam-allowance" />
<text x="155" y="200" class="highlight" transform="rotate(90, 155, 200)">+2" GROWTH_ALLOWANCE</text>
</g>

<!-- 3. BACK PANEL (The Reach Expansion) -->

<g transform="translate(480, 100)">
<text x="0" y="-15" class="annotation">BACK PANEL (ACTION_BACK)</text>
<path d="M 0,0 L 200,0 L 220,350 Q 110,380 0,360 Z" class="cut-line shadow-zone" />

<!-- Action Slash for 25" Reach -->
<line x1="100" y1="0" x2="100" y2="365" class="mod-line" stroke-width="2" />
<rect x="90" y="50" width="20" height="250" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-dasharray="2,2"/>
<text x="105" y="180" class="highlight">ACTION_PLEAT: +7" EMANCIPATION</text>
<text x="105" y="195" class="annotation">HIDES 19" SHOULDERS</text>

<!-- Decorative Bow Hinge -->
<path d="M 70,40 Q 100,10 130,40 L 130,70 Q 100,100 70,70 Z" fill="#f43f5e" opacity="0.4" />
<text x="140" y="60" class="annotation" fill="#f43f5e">BOW_SYNC_LOCKED</text>


</g>

<!-- 4. Legend / Footnote -->

<g transform="translate(100, 600)">
<rect width="600" height="80" fill="white" stroke="#rose-100" rx="20" shadow="sm" />
<text x="20" y="30" class="annotation" fill="#fb7185">MTT_SYNC: 6'3" // THIGH: 31" // KNEE: 23"</text>
<text x="55" y="55" class="highlight">"OMG bestie, stay ruffly for Penny! No smart words allowed!"</text>

<!-- Haptic/Subliminal Pulse Visualization -->
<circle cx="550" cy="40" r="10" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="2,2">
  <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" />
</circle>
<text x="500" y="45" class="annotation" text-anchor="end" opacity="0.5">AYANEO_PULSE</text>


</g>
</svg>