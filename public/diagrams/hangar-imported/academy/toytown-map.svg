<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="40" font-family="serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#3D2F28">
    TOYTOWN PLANET - Educational District
  </text>
  <text x="500" y="70" font-family="serif" font-size="16" text-anchor="middle" fill="#8B7355">
    Where Learning Meets Style
  </text>
  
  <!-- Main road (horizontal) -->
  <rect x="50" y="320" width="900" height="60" fill="#D4C5B9" stroke="#8B7355" stroke-width="3"/>
  <line x1="50" y1="350" x2="950" y2="350" stroke="#FFD700" stroke-width="2" stroke-dasharray="20,10"/>
  <text x="500" y="355" font-family="serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#666">
    MAIN STREET
  </text>
  
  <!-- Nursery School (top left) -->
  <g id="school">
    <rect x="80" y="120" width="280" height="180" fill="#FFB6C1" opacity="0.4" stroke="#3D2F28" stroke-width="4" rx="10"/>
    <text x="220" y="155" font-family="serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#3D2F28">
      🏫 NURSERY SCHOOL
    </text>
    <text x="220" y="180" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#3D2F28">
      Run by Marcel &amp; Nanny
    </text>
    
    <!-- School details -->
    <rect x="100" y="195" width="240" height="90" fill="#F5F1E8" stroke="#8B7355" stroke-width="1"/>
    <text x="220" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• Classrooms</text>
    <text x="220" y="235" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• Fawn's Wellness Center</text>
    <text x="220" y="255" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• AR Paper Detection</text>
    <text x="220" y="275" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• Character Interactions</text>
  </g>
  
  <!-- Path to road -->
  <path d="M 220 300 L 220 320" stroke="#8B7355" stroke-width="3" fill="none"/>
  <circle cx="220" cy="320" r="5" fill="#3D2F28"/>
  
  <!-- Department Store (top right) -->
  <g id="dept-store">
    <rect x="640" y="120" width="280" height="180" fill="#E6B8E6" opacity="0.4" stroke="#3D2F28" stroke-width="4" rx="10"/>
    <text x="780" y="155" font-family="serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#3D2F28">
      🏢 DEPARTMENT STORE
    </text>
    <text x="780" y="180" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#3D2F28">
      DollOS Academy &amp; Services
    </text>
    
    <!-- Store details -->
    <rect x="660" y="195" width="240" height="90" fill="#F5F1E8" stroke="#8B7355" stroke-width="1"/>
    <text x="780" y="215" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• Marcel's Salon &amp; Warehouse</text>
    <text x="780" y="235" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• Miss Education's Academy</text>
    <text x="780" y="255" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• Manufacturing Floor</text>
    <text x="780" y="275" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">• Dolly's Document Room</text>
  </g>
  
  <!-- Path to road -->
  <path d="M 780 300 L 780 320" stroke="#8B7355" stroke-width="3" fill="none"/>
  <circle cx="780" cy="320" r="5" fill="#3D2F28"/>
  
  <!-- Rail Station (bottom, across from dept store) -->
  <g id="rail-station">
    <rect x="640" y="400" width="280" height="200" fill="#B8E6CF" opacity="0.4" stroke="#3D2F28" stroke-width="4" rx="10"/>
    <text x="780" y="435" font-family="serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#3D2F28">
      🚂 TOYTOWN STATION
    </text>
    <text x="780" y="460" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#3D2F28">
      Direct Service to London
    </text>
    
    <!-- Station details -->
    <rect x="660" y="475" width="240" height="110" fill="#F5F1E8" stroke="#8B7355" stroke-width="1"/>
    <text x="780" y="495" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">🚉 Platform 1: London Express</text>
    <text x="780" y="515" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">⏱️ Journey: 20 minutes</text>
    <text x="780" y="535" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">🎫 Ticket Office</text>
    <text x="780" y="555" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">☕ Waiting Room (Nanny's Tea)</text>
    <text x="780" y="575" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#3D2F28">🔔 Pastel Steam Engine</text>
  </g>
  
  <!-- Path to road -->
  <path d="M 780 400 L 780 380" stroke="#8B7355" stroke-width="3" fill="none"/>
  <circle cx="780" cy="380" r="5" fill="#3D2F28"/>
  
  <!-- Pedestrian Crossing (dotted line) -->
  <rect x="750" y="330" width="60" height="40" fill="none" stroke="#3D2F28" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="780" y="355" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#3D2F28">CROSSING</text>
  
  <!-- Walking paths -->
  <g id="paths">
    <!-- School to Store -->
    <path d="M 360 210 Q 500 150 640 210" stroke="#00D9FF" stroke-width="2" stroke-dasharray="5,3" fill="none" opacity="0.6"/>
    <text x="500" y="145" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#00D9FF">
      5 min walk
    </text>
    
    <!-- Store to Station -->
    <path d="M 780 300 L 780 400" stroke="#00D9FF" stroke-width="3" fill="none" opacity="0.6"/>
    <text x="810" y="350" font-family="sans-serif" font-size="10" fill="#00D9FF">
      Across
    </text>
    <text x="810" y="365" font-family="sans-serif" font-size="10" fill="#00D9FF">
      the road
    </text>
  </g>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="420" width="220" height="160" fill="#F5F1E8" stroke="#8B7355" stroke-width="2"/>
    <text x="60" y="445" font-family="serif" font-size="14" font-weight="bold" fill="#3D2F28">LEGEND:</text>
    
    <circle cx="70" cy="465" r="5" fill="#3D2F28"/>
    <text x="85" y="470" font-family="sans-serif" font-size="11" fill="#3D2F28">Building Entrance</text>
    
    <line x1="60" y1="485" x2="90" y2="485" stroke="#00D9FF" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="100" y="490" font-family="sans-serif" font-size="11" fill="#3D2F28">Walking Path</text>
    
    <rect x="60" y="500" width="20" height="15" fill="#FFB6C1" opacity="0.4" stroke="#3D2F28" stroke-width="1"/>
    <text x="90" y="512" font-family="sans-serif" font-size="11" fill="#3D2F28">School Zone</text>
    
    <rect x="60" y="525" width="20" height="15" fill="#E6B8E6" opacity="0.4" stroke="#3D2F28" stroke-width="1"/>
    <text x="90" y="537" font-family="sans-serif" font-size="11" fill="#3D2F28">Commercial Zone</text>
    
    <rect x="60" y="550" width="20" height="15" fill="#B8E6CF" opacity="0.4" stroke="#3D2F28" stroke-width="1"/>
    <text x="90" y="562" font-family="sans-serif" font-size="11" fill="#3D2F28">Transport Hub</text>
  </g>
  
  <!-- Dolly's Route Arrow -->
  <g id="dolly-route">
    <path d="M 360 210 L 640 210 L 780 300 L 780 400 L 780 480" 
          stroke="#FF69B4" stroke-width="4" fill="none" opacity="0.7" 
          marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
        <polygon points="0 0, 10 5, 0 10" fill="#FF69B4"/>
      </marker>
    </defs>
    <text x="330" y="430" font-family="serif" font-size="14" font-weight="bold" fill="#FF69B4">
      Dolly's Daily Route →
    </text>
    <text x="330" y="450" font-family="sans-serif" font-size="11" fill="#FF69B4">
      1. School dismissal
    </text>
    <text x="330" y="468" font-family="sans-serif" font-size="11" fill="#FF69B4">
      2. Walk to Department Store
    </text>
    <text x="330" y="486" font-family="sans-serif" font-size="11" fill="#FF69B4">
      3. Salon/Academy sessions
    </text>
    <text x="330" y="504" font-family="sans-serif" font-size="11" fill="#FF69B4">
      4. Cross to Station
    </text>
    <text x="330" y="522" font-family="sans-serif" font-size="11" fill="#FF69B4">
      5. (Optional) Train to London
    </text>
  </g>
  
  <!-- Footer -->
  <text x="500" y="680" font-family="serif" font-size="12" text-anchor="middle" fill="#8B7355">
    All locations on Toytown Planet • Learning Nexus Node: DOLLOS_DEPT_STORE_ACADEMY
  </text>
</svg>
