<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-label="Belt printer in side view, 45 degree print head, continuous strip of dragon scale coming off the back of the belt.">
  <title>Belt printer producing a continuous dragon-scale strip</title>
  <g fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Printer frame -->
    <rect x="40" y="40" width="180" height="120" rx="4" />
    <!-- Belt rollers -->
    <circle cx="70" cy="150" r="14" />
    <circle cx="200" cy="150" r="14" />
    <!-- Belt surface -->
    <line x1="70" y1="136" x2="200" y2="136" />
    <line x1="70" y1="164" x2="200" y2="164" />
    <!-- 45 degree print head (gantry rail + extruder) -->
    <line x1="50" y1="60" x2="200" y2="60" />
    <path d="M120 60 L140 60 L140 80 L130 100 L110 100 L120 80 Z" />
    <!-- Nozzle drop -->
    <line x1="125" y1="100" x2="125" y2="110" />
    <!-- Strip emerging off the back of the belt -->
    <g>
      <path d="M220 150 Q260 152 290 158" />
      <!-- Scale rhythm on the strip -->
      <path d="M232 148 Q238 138 248 148" />
      <path d="M248 148 Q254 138 264 148" />
      <path d="M264 148 Q270 138 280 148" />
      <path d="M280 148 Q286 138 296 148" />
      <path d="M232 158 Q238 168 248 158" />
      <path d="M248 158 Q254 168 264 158" />
      <path d="M264 158 Q270 168 280 158" />
      <path d="M280 158 Q286 168 296 158" />
    </g>
    <!-- Strip continuation arrow -->
    <path d="M300 158 L334 162" stroke-dasharray="3 3" />
    <path d="M328 158 L334 162 L328 166" />
    <!-- Catch tray -->
    <path d="M298 170 Q318 184 338 180" stroke-dasharray="2 3" />
  </g>
</svg>
