[project]
name = "splat360"
version = "0.1.0"
description = "360-camera-first Gaussian Splat service for Holoflow Studio."
requires-python = ">=3.12,<3.14"
readme = "README.md"

dependencies = [
  # Web service
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "aiofiles>=24.1",

  # Image / video / numeric
  "numpy>=2.0",
  "opencv-python>=4.10",

  # Telemetry / EXIF — ExifTool is invoked as subprocess; this is the
  # Python wrapper used by pipeline/metadata.py.
  "pyexiftool>=0.5",

  # RAW DNG handling — needed by the fisheye-pair adapters when they
  # demosaic the Avata 360 / Osmo 360 RAW pairs. Optional at import
  # time (the adapters only import it inside functions).
  # "rawpy>=0.24",
  # "imageio>=2.36",

  # SfM and training stacks are invoked as subprocesses. Per-backend
  # Python deps (hloc, opensfm) install into the running interpreter's
  # env or into a backend-specific env (see backend module docstrings).
]

[project.optional-dependencies]
# Pull these into the runtime env if you want to run the corresponding
# backends inside the same Python interpreter rather than a sidecar env.
hloc = [
  "torch",
  "pycolmap",
  # hloc itself is git-installed:
  # pip install "git+https://github.com/cvg/Hierarchical-Localization.git"
]
gsplat = [
  "torch",
  "nerfstudio",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splat360"]
